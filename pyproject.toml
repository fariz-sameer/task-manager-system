[project]
name = "task-manager-system"
version = "0.1.0"
description = "A web-based task management system for organizing and tracking tasks with features such as task creation, assignment, progress tracking and deadlines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==6.0.7",
    "google-genai>=2.13.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv==1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]