readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.11.1",
    "beautifulsoup4==4.15.0",
    "cfgv==3.5.0",
    "distlib==0.4.3",
    "django==6.0.7",
    "filelock==3.29.7",
    "google-genai>=2.13.0",
    "gunicorn>=26.0.0",
    "identify==2.6.19",
    "nodeenv==1.10.0",
    "platformdirs==4.10.0",
    "pre-commit==4.6.0",
    "python-discovery==1.4.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "soupsieve==2.9.1",
    "sqlparse==0.5.5",
    "typing-extensions==4.16.0",
    "tzdata==2026.3",
    "virtualenv==21.6.1",
    "whitenoise>=6.12.0",
]
