services:
  db:
    image: postgres:18

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/fariz-sameer/task-manager-system:latest

    restart: unless-stopped

    env_file:
      - .env

    command:
      - gunicorn
      - TaskManagementSystem.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --access-logfile=-
      - --error-logfile=-

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
