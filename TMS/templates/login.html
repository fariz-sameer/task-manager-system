 {% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="login-page">

    <h1>Task Management System</h1>

    <div class="login-card">

        <div class="login-icon">

            <i class="bi bi-person-circle"></i>

        </div>

        <h2>Welcome Back</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success">

                <i class="bi bi-box-arrow-in-right"></i>

                Log In

            </button>

        </form>

        <a
            class="forpass"
            href="{% url 'password_reset' %}">

            Forgot your password?

        </a>

        <hr>

        <p class="signup-text">

            Don't have an account?

            <a href="{% url 'signup' %}">

                Register

            </a>

        </p>

    </div>

</div>

</body>

</html>

<style>
    body{

    margin:0;

    background:#EEF5EE;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    font-family:Arial, Helvetica, sans-serif;
    

}

.login-page{

    text-align:center;

}

/* h1{

    font-family:"Doto", sans-serif;

    font-size:64px;

    color:#2D6A4F;

    margin-bottom:65px;

    letter-spacing:3px;

} */
h1{

    font-family:"Doto",sans-serif;

    color:#2D6A4F;

    animation: glow 2s ease-in-out infinite;
    
    font-size: 64px;

    margin-bottom:65px;

}

@keyframes glow{

    0%{

        text-shadow:

            0 0 5px #2D6A4F,

            0 0 10px #2D6A4F;

    }

    50%{

        text-shadow:

            0 0 15px #8fd19e,

            0 0 30px #8fd19e,

            0 0 45px white;

    }

    100%{

        text-shadow:

            0 0 5px #2D6A4F,

            0 0 10px #2D6A4F;

    }

}
.login-card{

    width:450px;

    margin:auto;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 12px 35px rgba(0,0,0,.18);
    

}

.login-icon{

    font-size:70px;

    color:#2D6A4F;

    margin-bottom:15px;

}

.login-card h2{

    margin-bottom:30px;

    color:#2D6A4F;

    font-weight:bold;

}

.login-card p{

    text-align:left;

}

.login-card input{

    width:100%;

    padding:12px;

    margin-bottom:18px;

    border:1px solid #ccc;

    border-radius:12px;

}

.btn-success{

    width:100%;

    padding:12px;

    border-radius:12px;

    font-size:18px;

    font-weight:600;

    background:#2D6A4F;

    border:none;

}

.btn-success:hover{

    background:#40916C;

}

.forpass{

    display:block;

    margin-top:20px;

    color:#6c757d;

    text-decoration:none;

}

.forpass:hover{

    color:#2D6A4F;

}

hr{

    margin:25px 0;

}

.signup-text{
    display: flex;
    justify-content: center;
    margin-top: 25px;
}
</style>
