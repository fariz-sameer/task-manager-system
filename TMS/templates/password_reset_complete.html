{% load static %}
<!DOCTYPE html>
<html>

<head>

    <title>Password Changed</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="success-page">

    <h1>Task Management System</h1>

    <div class="success-card">

        <div class="success-icon">

            <i class="bi bi-check-circle-fill"></i>

        </div>

        <h2>Password Changed!</h2>

        <p>

            Your password has been updated successfully.
            You can now log in using your new password.

        </p>

        <a
            href="{% url 'login' %}"
            class="btn btn-success">

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Go to Login

        </a>

    </div>

</div>

</body>

<style>

body{

    margin:0;

    background:#EEF5EE;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    font-family:Arial, Helvetica, sans-serif;

}

.success-page{

    text-align:center;

}

h1{

    font-family:"Doto", sans-serif;

    font-size:64px;

    color:#2D6A4F;

    margin-bottom:45px;

    letter-spacing:3px;

}

.success-card{

    width:460px;

    margin:auto;

    background:white;

    padding:45px;

    border-radius:25px;

    box-shadow:0 12px 35px rgba(0,0,0,.18);

}

.success-icon{

    font-size:80px;

    color:#28A745;

    margin-bottom:20px;

}

.success-card h2{

    color:#2D6A4F;

    font-weight:bold;

    margin-bottom:15px;

}

.success-card p{

    color:#555;

    margin-bottom:35px;

    font-size:16px;

    line-height:1.6;

}

.btn-link{

    display:block;

    width:100%;

    padding:14px;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        #1B3C87,
        #2D8EC5
    );

    color:white;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;

}

.btn-link:hover{

    color:white;

    transform:translateY(-4px);

    box-shadow:0 12px 25px rgba(45,142,197,.5);

}

.btn-success{

    display:inline-block;

    width:100%;

    padding:12px;

    border-radius:12px;

    font-size:18px;

    font-weight:600;

    background:#2D6A4F;

    border:none;

    text-decoration:none;

    color:white;

    transition:.2s;

}

.btn-success:hover{

    background:#40916C;

    transform:translateY(-2px);

    color:white;

}

</style>

</html>
