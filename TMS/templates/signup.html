<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="signup-page">

    <!-- <h1>Task Management System</h1> -->

    <div class="signup-card">

        <div class="signup-icon">

            <i class="bi bi-person-plus-fill"></i>

        </div>

        <h2>Create Account</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success">

                <i class="bi bi-person-check-fill me-2"></i>

                Register

            </button>

        </form>

        <hr>

        <p>

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </p>

    </div>

</div>

</body>

<style>

body{

    margin:50px 50px;

    background:#EEF5EE;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    font-family:Arial, Helvetica, sans-serif;

}

.signup-page{

    text-align:center;
     

}

h1{

    font-family:"Doto", sans-serif;

    font-size:64px;

    color:#2D6A4F;

    margin-bottom:45px;

    letter-spacing:3px;

}

.signup-card{
    
    width: 450px;

    margin:auto;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 12px 35px rgba(0,0,0,.18);

}

.signup-icon{

    font-size:70px;

    color:#2D6A4F;

    margin-bottom:15px;

}

.signup-card h2{

    margin-bottom:30px;

    color:#2D6A4F;

    font-weight:bold;

}

.signup-card p{

    text-align:left;

}

.signup-card input{

    width:100%;

    padding:12px;

    margin-bottom:18px;

    border:1px solid #ccc;

    border-radius:12px;

    transition:.2s;

}

.signup-card input:focus{

    border-color:#2D6A4F;

    box-shadow:0 0 0 .2rem rgba(45,106,79,.15);

    outline:none;

}

.btn-success{

    width:100%;

    padding:12px;

    border-radius:12px;

    font-size:18px;

    font-weight:600;

    background:#2D6A4F;

    border:none;

    transition:.2s;

}

.btn-success:hover{

    background:#40916C;

    transform:translateY(-2px);

}

hr{

    margin:25px 0;

}

a{

    text-decoration:none;

    color:#2D6A4F;

    font-weight:600;

}

a:hover{

    text-decoration:underline;

}

</style>

</html>
