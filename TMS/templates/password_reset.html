<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="forgot-page">

    <div class="forgot-card">

        <div class="forgot-icon">

            <i class="bi bi-envelope-lock-fill"></i>

        </div>

        <h2>Forgot Password?</h2>

        <p>

            Enter the email address associated with your account.
            We'll send you a password reset link.

        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success">

                <i class="bi bi-send-fill me-2"></i>

                Send Reset Link

            </button>

        </form>

        <hr>

        <p class="back-login">

            Remember your password?

            <a href="{% url 'login' %}">

                Back to Login

            </a>

        </p>

    </div>

</div>

</body>

<style>

body{

    margin:0;

    background:#EEF5EE;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    font-family:Arial, Helvetica, sans-serif;

}

.forgot-page{

    text-align:center;

}

h1{

    font-family:"Doto", sans-serif;

    font-size:64px;

    color:#2D6A4F;

    margin-bottom:45px;

    letter-spacing:3px;

}

.forgot-card{

    width:460px;

    margin:auto;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 12px 35px rgba(0,0,0,.18);

}

.forgot-icon{

    font-size:70px;

    color:#2D6A4F;

    margin-bottom:15px;

}

.forgot-card h2{

    color:#2D6A4F;

    font-weight:bold;

    margin-bottom:15px;

}

.forgot-card p{

    color:#555;

    margin-bottom:25px;

}

.forgot-card input{

    width:100%;

    padding:12px;

    margin-bottom:20px;

    border:1px solid #ccc;

    border-radius:12px;

    transition:.2s;

}

.forgot-card input:focus{

    border-color:#2D6A4F;

    box-shadow:0 0 0 .2rem rgba(45,106,79,.15);

    outline:none;

}

.btn-success{

    width:100%;

    padding:12px;

    border-radius:12px;

    font-size:18px;

    font-weight:600;

    background:#2D6A4F;

    border:none;

    transition:.2s;

}

.btn-success:hover{

    background:#40916C;

    transform:translateY(-2px);

}

hr{

    margin:25px 0;

}

.back-login{

    margin-bottom:0;

}

a{

    color:#2D6A4F;

    text-decoration:none;

    font-weight:600;

}

a:hover{

    text-decoration:underline;

}

</style>

</html>
