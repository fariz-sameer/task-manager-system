{% load static %}
<!DOCTYPE html>
<html>

<head>

    <title>Set New Password</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="password-page">

    <h1>Task Management System</h1>

    <div class="password-card">

        <div class="password-icon">

            <i class="bi bi-shield-lock-fill"></i>

        </div>

        <h2>Set a New Password</h2>

        <p>

            Enter your new password below and confirm it to continue.

        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success">

                <i class="bi bi-key-fill me-2"></i>

                Change Password

            </button>

        </form>

    </div>

</div>

</body>

<style>

body{

    margin:0;

    background:#EEF5EE;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    font-family:Arial, Helvetica, sans-serif;

}

.password-page{

    text-align:center;

}

h1{

    font-family:"Doto", sans-serif;

    font-size:64px;

    color:#2D6A4F;

    margin-bottom:45px;

    letter-spacing:3px;

}

.password-card{

    width:460px;

    margin:auto;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 12px 35px rgba(0,0,0,.18);

}

.password-icon{

    font-size:70px;

    color:#2D6A4F;

    margin-bottom:15px;

}

.password-card h2{

    color:#2D6A4F;

    font-weight:bold;

    margin-bottom:15px;

}

.password-card p{

    color:#555;

    margin-bottom:25px;

}

.password-card input{

    width:100%;

    padding:12px;

    margin-bottom:20px;

    border:1px solid #ccc;

    border-radius:12px;

    transition:.2s;

}

.password-card input:focus{

    border-color:#2D6A4F;

    box-shadow:0 0 0 .2rem rgba(45,106,79,.15);

    outline:none;

}

.btn-success{

    width:100%;

    padding:12px;

    border-radius:12px;

    font-size:18px;

    font-weight:600;

    background: linear-gradient(135deg, #40916c, #163225) !important;

    border:none;

    transition:.2s;

}

.btn-success:hover{

    background:#40916C;

    transform:translateY(-2px);

}

</style>

</html>
