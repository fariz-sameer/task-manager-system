{% load static %}
<!DOCTYPE html>
<html>

<head>

    <title>Password Reset</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="reset-page">

    <h1>Task Management System</h1>

    <div class="reset-card">

        <div class="reset-icon">

            <i class="bi bi-envelope-check-fill"></i>

        </div>

        <h2>Check Your Email</h2>

        <p>

            If an account with that email address exists,
            a password reset link has been sent.

        </p>

        <p class="small-text">

            Please check your inbox (and spam folder if necessary)
            and follow the instructions to reset your password.

        </p>

        <a
            href="{% url 'login' %}"
            class="btn btn-success">

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Return to Login

        </a>

    </div>

</div>

</body>

<style>

body{

    margin:0;

    background:#EEF5EE;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    font-family:Arial, Helvetica, sans-serif;

}

.reset-page{

    text-align:center;

}

h1{

    font-family:"Doto", sans-serif;

    font-size:64px;

    color:#2D6A4F;

    margin-bottom:45px;

    letter-spacing:3px;

}

.reset-card{

    width:470px;

    margin:auto;

    background:white;

    padding:45px;

    border-radius:25px;

    box-shadow:0 12px 35px rgba(0,0,0,.18);

}

.reset-icon{

    font-size:80px;

    color:#2D6A4F;

    margin-bottom:20px;

}

.reset-card h2{

    color:#2D6A4F;

    font-weight:bold;

    margin-bottom:15px;

}

.reset-card p{

    color:#555;

    line-height:1.6;

}

.small-text{

    font-size:14px;

    color:#777;

    margin-top:15px;

    margin-bottom:35px;

}

.btn-success{

    display:inline-block;

    width:100%;

    padding:12px;

    border-radius:12px;

    font-size:18px;

    font-weight:600;

    background:#2D6A4F;

    border:none;

    color:white;

    text-decoration:none;

    transition:.2s;

}

.btn-success:hover{

    background:#40916C;

    transform:translateY(-2px);

    color:white;

}

</style>

</html>
